	<script type="text/javascript" src="~/Scripts/Map/locationpicker.jquery.min.js"></script>
	<script type="text/javascript">
		var mapCenter = "";
        var map = "";
        var marker = "";
		$(document).ready(function () {			
					
			map_initialize(); // load map
			function map_initialize() {


                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showPosition);
                    function showPosition(position) {
                        var lat = position.coords.latitude;
                        var lng = position.coords.longitude;
                        mapCenter = new google.maps.LatLng(lat, lng); //Google map Coordinates
                        //Google map option
                        var googleMapOptions = {
                            center: mapCenter,
                            panControl: true,
                            zoomControl: true,
                            mapTypeControl: true,
                            //mapTypeControlOptions: {
                            //    style: google.maps.MapTypeControlStyle.DROPDOWN_MENU,
                            //    position: google.maps.ControlPosition.TOP_CENTER
                            //},
                            scaleControl: true,
                            streetViewControl: true,
                            overviewMapControl: true,
                            rotateControl: true,
                            zoom: 17,
                            mapTypeId: google.maps.MapTypeId.ROADMAP,
                            zoomControlOptions: {
                                style: google.maps.ZoomControlStyle.SMALL //zoom control size
                            },
                        };
                        //var googleMapOptions =
                        //{
                        //    //center: mapCenter, // map center
                        //    //zoom: 17, //zoom level, 0 = earth view to higher value
                        //    //panControl: true, //enable pan Control
                        //    //zoomControl: true, //enable zoom control
                        //    //zoomControlOptions: {
                        //    //    style: google.maps.ZoomControlStyle.SMALL //zoom control size
                        //    //},
                        //    //scaleControl: true, // enable scale control
                        //    //mapTypeId: google.maps.MapTypeId.ROADMAP // google map type
                        //};
                        map = new google.maps.Map(document.getElementById("google_map"), googleMapOptions);
                        //##### drop a new marker on right click ######
                        google.maps.event.addListener(map, 'click', function (event) {
                            console.log(map);
                            console.log(event);
                            //if (marker != "")
                            //    marker.setMap(null);
                            marker = new google.maps.Marker({
                                position: event.latLng, //map Coordinates where user right clicked
                                map: map,
                                draggable: true, //set marker draggable
                                animation: google.maps.Animation.DROP, //bounce animation
                                title: "Hello World!",
                                //icon: "icons/pin_green.png" //custom pin icon
                            });
                            
                            //Content structure of info Window for the Markers
                            var contentString = $('<div name="markermap" class="marker-info-win">' +
                                '<div class="marker-inner-win"><span class="info-content">' +
                                '<h1 class="marker-heading">New Marker</h1>' +
                                'This is a new marker infoWindow' +
                                '</span>' +
                                '<br /><button name="remove-marker" class="remove-marker" title="Remove Marker">Remove Marker</button></div></div>');

                            //Create an infoWindow
                            var infowindow = new google.maps.InfoWindow();

                            //set the content of infoWindow
                            infowindow.setContent(contentString[0]);

                            //add click listner to marker which will open infoWindow
                            google.maps.event.addListener(marker, 'click', function () {                                
                                infowindow.open(map, marker); // click on marker opens info window
                            });


                            //###### remove marker #########/
                            var removeBtn = contentString.find('button.remove-marker')[0];
                            google.maps.event.addDomListener(removeBtn, "click", function (event) {
                                marker.setMap(null);
                            });

                        });

                        
					}
                }
			}

            //$('#google_map').locationpicker({
            //    location: {

            //        longitude: lng
            //    },
            //    radius: 10,

            //    scrollwheel: true,
            //    markerIcon: undefined,
            //    markerDraggable: true,
            //    enableReverseGeocode: true,
            //    draggable: true,
            //    markerVisible: true,
            //    //styles: customStyles,
            //    enableAutocomplete: true,
            //    onchanged: function (currentLocation, radius, isMarkerDropped) {
            //        var addressComponents = $(this).locationpicker('map').location.addressComponents;
            //        console.log(addressComponents);
            //        // Uncomment line below to show alert on each Location Changed event
            //        //alert("Location changed. New location (" + currentLocation.latitude + ", " + currentLocation.longitude + ")");
            //    },
            //    oninitialized: function (component) {
            //        var addressComponents = $(component).locationpicker('map').location.addressComponents;
            //        console.log(addressComponents);
            //    }
            //});
		});
	</script>
	<style type="text/css">
		h1.heading {
			padding: 0px;
			margin: 0px 0px 10px 0px;
			text-align: center;
			font: 18px Georgia, "Times New Roman", Times, serif;
		}

		/* width and height of google map */
		#google_map {
			width: 90%;
			height: 500px;
			margin-top: 0px;
			margin-left: auto;
			margin-right: auto;
		}

		/* Marker Info Window */
		h1.marker-heading {
			color: #585858;
			margin: 0px;
			padding: 0px;
			font: 18px "Trebuchet MS", Arial;
			border-bottom: 1px dotted #D8D8D8;
		}

		div.marker-info-win {
			margin-right: -20px;
		}

			div.marker-info-win p {
				padding: 0px;
				margin: 10px 0px 10px 0;
			}

		div.marker-inner-win {
			padding: 5px;
		}

		button.save-marker, button.remove-marker {
			border: none;
			background: rgba(0, 0, 0, 0);
			color: #00F;
			padding: 0px;
			text-decoration: underline;
			margin-right: 10px;
			cursor: pointer;
		}
	</style>

<body>             
<h1 class="heading">My Google Map</h1>
<div align="center">Right Click to Drop a New Marker</div>
