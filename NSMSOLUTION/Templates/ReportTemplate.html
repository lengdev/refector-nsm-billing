    <title>{Title}</title>

    <style type="text/css">
        .khmerFont {
            font-family: 'Noto Sans Khmer', sans-serif;
            font-weight: normal;
        }

        .khmerFontMoul {
            font-family: 'Moul', cursive;
            font-weight: normal;
        }

        .khmerFont1-Header {
            font-family: 'Kantumruy Pro', sans-serif;
        }

        .khmerFont1 {
            font-family: 'Kantumruy Pro', sans-serif;
            font-weight: normal;
            font-size: 100%;
        }

        @page {
            margin: 0.5in;
        }

        th {
            white-space: nowrap;
        }
    </style>

    <script src="../Scripts/jquery-3.7.1.min.js"></script>
    <script src="../Scripts/JScript_Function.js"></script>
</head>
<body>

    <section id="sectionPrintData">
        <div class="row p-2">
            <div class="col">
                <img class="img-fluid p-2" width="240" src="{CompanyLogo}" />
            </div>
            <div class="col-auto">
                <h5 class="khmerFontMoul">
                    {CompanyKHName}<br />
                </h5>
                <h5 class="text-center">
                    {CompanyName}
                </h5>
                <div class="text-center">
                    <span style="color: #555;">~~~~~~~<i style="font-size: 12px" class="fa-duotone fa-asterisk"></i>~~~~~~~</span>
                </div><br />
                <div class="text-center">
                    <h5 class="text-uppercase">
                        {ReportTitle}
                    </h5>
                </div>
                <div class="text-center">
                    <h6 class="text-uppercase">
                        {FromDate}
                        {ToDate}
                    </h6>
                </div>
            </div>
            <div class="col">
                &nbsp;
            </div>
        </div>
        <div class="row">
            <div class="col khmerFont1">
                {BodyMessage}
            </div>
        </div>
    </section>

    <!--<script src="//Content/AdminLTE-3.2.0/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="//Content/AdminLTE-3.2.0/dist/js/adminlte.min.js"></script>
    <script src="//Content/AdminLTE-3.2.0/plugins/sweetalert2/sweetalert2.min.js"></script>
    <script src="//Scripts/LocalStorage.js"></script>-->
    <script>
        $(function () {
            var curDown = false,
                curYPos = 0,
                curXPos = 0;

            $(window).mousemove(function (m) {
                if (curDown) {
                    window.scrollBy(curXPos - m.pageX, curYPos - m.pageY)
                }
            });

            $(window).mousedown(function (m) {
                curYPos = m.pageY;
                curXPos = m.pageX;
                curDown = true;
            });

            $(window).mouseup(function () {
                curDown = false;
            });
        });
    </script>
</body>
</html>
