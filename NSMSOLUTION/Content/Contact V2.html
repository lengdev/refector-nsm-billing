<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Contact V2</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="stylesheet" type="text/css" href="AdminLTE-3.0.5/dist/css/adminlte.min.css">


    <link rel="stylesheet" type="text/css" href="ContactV2_files/main.css">

    <meta name="robots" content="noindex, follow">
</head>
<body>
    <div class="container-contact2">
        <div class="wrap-contact2">
            <form class="contact2-form validate-form">
                <div class="wrap-input2 validate-input" data-validate="Name is required">
                    <input class="input2" type="text" name="name">
                    <span class="focus-input2" data-placeholder="NAME"></span>
                </div>
                <div class="wrap-input2 validate-input alert-validate" data-validate="Valid email is required: ex@abc.xyz">
                    <input class="input2" type="text" name="email">
                    <span class="focus-input2" data-placeholder="EMAIL"></span>
                </div>
                <div class="wrap-input2 validate-input alert-validate" data-validate="Message is required">
<textarea class="input2" name="message"></textarea>
                    <span class="focus-input2" data-placeholder="MESSAGE"></span>
                </div>
                <div class="container-contact2-form-btn">
                    <div class="wrap-contact2-form-btn">
                        <div class="contact2-form-bgbtn"></div>
                        <button class="contact2-form-btn">
                            Send Your Message
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="/Scripts/jquery-3.5.1.js"></script>

    <script src="ContactV2_files/popper.js"></script>
    <script src="ContactV2_files/main.js"></script>
</body>
</html>
